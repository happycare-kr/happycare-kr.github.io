<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>행복케어 통합관리 ERP 연결 중</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: 'Pretendard','Malgun Gothic',sans-serif;
    background: #F1F5F9; color: #0F172A; min-height: 100vh;
    display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .box {
    max-width: 420px; width: 100%; background: #FFF; border: 1.5px solid #CBD5E1;
    border-radius: 16px; padding: 24px 20px; text-align: center;
    box-shadow: 0 12px 32px rgba(15,23,42,.08);
  }
  .badge {
    display: inline-block; padding: 4px 10px; border-radius: 999px;
    background: #DBEAFE; color: #1E40AF; font-size: 11.5px; font-weight: 800; margin-bottom: 10px;
  }
  h1 { font-size: 18px; margin: 0 0 8px; color: #1B365D; font-weight: 900; }
  p { font-size: 13px; color: #475569; line-height: 1.55; margin: 0 0 16px; }
  .btn {
    display: inline-block; width: 100%; padding: 12px 16px; border-radius: 10px;
    background: #1B365D; color: #FFF; font-weight: 900; font-size: 14px;
    text-decoration: none; border: none; cursor: pointer;
  }
  .sub-btn {
    display: inline-block; width: 100%; margin-top: 8px; padding: 10px 14px;
    border-radius: 10px; background: #EFF6FF; color: #1E3A8A; font-weight: 800;
    font-size: 13px; border: 1px solid #93C5FD; cursor: pointer;
  }
  .meta { margin-top: 12px; font-size: 11px; color: #64748B; word-break: break-all; }
</style>
</head>
<body>
<div class="box">
  <span class="badge">PC 서버 실시간 고정 포털 · ERP</span>
  <h1 id="st-title">실시간 PC ERP 서버로 연결 중입니다...</h1>
  <p id="st-desc">잠시만 기다리시면 최신 통합관리 ERP 화면으로 자동 이동합니다.</p>
  <a id="go-btn" class="btn" href="#" style="display:none;">지금 바로 열기</a>
  <button type="button" class="sub-btn" onclick="connectLive(true)">연결 다시 시도</button>
  <div id="st-meta" class="meta"></div>
</div>
<script>
(function () {
  var TARGET_PATH = '/erp.html';
  var retryTimer = null;

  function buildTarget(baseUrl) {
    var clean = String(baseUrl || '').replace(/\/+$/, '');
    return clean + TARGET_PATH + (location.search || '') + (location.hash || '');
  }

  function showOffline(msg, baseUrl) {
    document.getElementById('st-title').textContent = 'PC 서버 연결 대기 중';
    document.getElementById('st-desc').textContent = msg || '메인 PC가 재부팅 중이거나 외부 터널을 다시 연결하는 중입니다. 5초마다 자동으로 다시 확인합니다.';
    var btn = document.getElementById('go-btn');
    if (baseUrl) {
      btn.href = buildTarget(baseUrl);
      btn.style.display = 'inline-block';
    } else {
      btn.style.display = 'none';
    }
    if (retryTimer) clearTimeout(retryTimer);
    retryTimer = setTimeout(function () { connectLive(false); }, 5000);
  }

  window.connectLive = function (manual) {
    if (retryTimer) { clearTimeout(retryTimer); retryTimer = null; }
    if (manual) {
      document.getElementById('st-title').textContent = 'PC 서버 주소를 다시 확인 중입니다...';
    }
    fetch('./live_endpoint.json?t=' + Date.now(), { cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (ep) {
        var base = ep && ep.url ? String(ep.url).trim() : '';
        if (!base || base.indexOf('https://') !== 0) {
          showOffline('활성 서버 주소가 아직 등록되지 않았습니다. 메인 PC 서버 기동 후 5초 뒤 다시 확인합니다.', '');
          return;
        }
        var target = buildTarget(base);
        document.getElementById('st-meta').textContent = '대상 서버: ' + base + (ep.updatedAt ? ' · 갱신: ' + ep.updatedAt : '');
        var btn = document.getElementById('go-btn');
        btn.href = target;
        btn.style.display = 'inline-block';
        location.replace(target);
      })
      .catch(function (err) {
        showOffline('서버 접속 정보 확인 중 일시적 지연이 발생했습니다 (' + (err && err.message || 'network') + '). 5초 후 자동 재시도합니다.', '');
      });
  };

  connectLive(false);
})();
</script>
</body>
</html>
